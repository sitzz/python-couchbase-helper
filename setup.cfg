[metadata]
name = couchbase-helper
version = attr: couchbase_helper.__version__
description = Simple Couchbase helper for Python 3.9+ adding basic functionality
long_description = file: README.md
long_description_content_type = text/markdown
author = Thomas 'sitzz' Vang
author_email = sitzzdk@gmail.com
url = https://github.com/sitzz/python-couchbase-helper
license = BSD-3
keywords =
    couchbase
    cbase
    cb
    couchbase-helper
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Natural Language :: English
    License :: OSI Approved :: BSD License
    Operating System :: POSIX
    Operating System :: Microsoft :: Windows
    Operating System :: MacOS :: MacOS X
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
zip_safe = false
include_package_data = true
packages =
    couchbase_helper
python_requires = >=3.9
install_requires =
    couchbase>=4.1.9,<4.6.0; python_version == "3.9"
    couchbase>=4.1.9,<5.0.0; python_version == "3.10"
    couchbase>=4.1.9,<5.0.0; python_version == "3.11"
    couchbase>=4.3.2,<5.0.0; python_version == "3.12"
    couchbase>=4.3.4,<5.0.0; python_version == "3.13"
    couchbase>=4.6.0,<5.0.0; python_version >= "3.14"
