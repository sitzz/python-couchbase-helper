[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["couchbase_helper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 98
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
