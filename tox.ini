; Local mirror of .github/workflows/tests.yml -- CI runs these same envs, so the
; two cannot drift.
;
; Local use (only Python 3.14 needs to be on the box; uv fetches the rest):
;     uv tool install tox --with tox-uv
;     tox -e py314-cblatest        # fastest single check
;     tox -p auto                  # the whole matrix, in parallel
;
; Two axes, because there are two ways this package breaks:
;   cblatest - newest SDK each interpreter permits. Catches "a new SDK release
;              broke us", which is what 4.6.0 did by renaming private modules.
;              Resolved straight from requirements.txt, so it also proves the
;              environment markers there are correct.
;   cbmin    - the exact minimum SDK declared for that interpreter. Catches
;              "we started using an API older SDKs don't have".

[tox]
envlist =
    lint
    type
    package
    py{39,310,311,312,313,314}-cblatest
    py{39,310,311,312,313,314}-cbmin
isolated_build = true
; Fail loudly rather than silently skipping an interpreter that is missing.
skip_missing_interpreters = false

[testenv]
description = Run the test suite on {basepython} against the SDK selected by the cblatest/cbmin factor
; requirements_test.txt already installs the package with `-e .`.
skip_install = true
; tox filters the environment, so TZ has to be passed through explicitly.
; Worth having: GitHub runners are UTC, which hides timezone-dependent bugs
; that show up immediately anywhere with a non-zero UTC offset. Reproduce with
;     TZ=Europe/Copenhagen tox -e py311-cbmin
passenv = TZ
deps =
    ; Test deps only -- requirements_dev.txt pulls in tox/mypy/build, which no
    ; longer support 3.9 and would break the py39 envs.
    -r requirements_test.txt
    ; Must stay in step with the floors in requirements.txt. 4.1.9 is the oldest
    ; usable release: earlier wheels dynamically link libssl.so.1.1, which no
    ; current distro ships, and 4.1.9 is also where the modern create_collection
    ; signature landed. Above that the floor is simply the first release with a
    ; wheel for that interpreter.
    py39-cbmin: couchbase==4.1.9
    py310-cbmin: couchbase==4.1.9
    py311-cbmin: couchbase==4.1.9
    py312-cbmin: couchbase==4.3.2
    py313-cbmin: couchbase==4.3.4
    py314-cbmin: couchbase==4.6.0
commands =
    ; Log the resolved combination up front; it is the first thing you want to
    ; know from a failing matrix job. Goes through our own version detection
    ; rather than couchbase.__version__, which older SDKs do not expose.
    python -c 'import sys; from couchbase_helper._compat import SDK_VERSION; print("python", sys.version.split()[0], "/ couchbase", ".".join(map(str, SDK_VERSION)))'
    pytest {posargs}

[testenv:lint]
description = ruff check and format verification
skip_install = true
; ruff is pinned in requirements_dev.txt -- deliberately, since its default rule
; set widens between releases, which turns an unpinned ruff into a surprise CI
; failure. Sourced from there so there is only one pin to keep current.
deps = -r requirements_dev.txt
commands =
    ; Scoped to the Python sources on purpose: ruff 0.16 also reformats Python
    ; code blocks inside Markdown, which would rewrite README.md.
    ruff check --no-cache {posargs:couchbase_helper tests}
    ruff format --check --no-cache --diff {posargs:couchbase_helper tests}

[testenv:package]
description = Build the sdist and wheel, and validate their metadata
skip_install = true
deps = -r requirements_dev.txt
commands =
    ; Built into a throwaway directory so stale artifacts in ./dist cannot mask
    ; a failure. Build isolation is left enabled on purpose, so the setuptools
    ; pinned in pyproject.toml is what actually produces the metadata -- that
    ; pin is the thing being tested.
    python -m build --outdir {envtmpdir}/dist
    ; --strict so warnings fail too. twine expands the glob itself, which
    ; matters because tox does not run commands through a shell.
    twine check --strict {envtmpdir}/dist/*

[testenv:type]
description = mypy against the package
skip_install = true
deps = -r requirements_dev.txt
commands = python -m mypy -p couchbase_helper {posargs}
